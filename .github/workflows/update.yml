name: Update formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable ttt version, without v (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          mkdir -p Formula
          gh release download "v$VERSION" --repo NickRoux/ttt --pattern ttt.rb --dir Formula --clobber
          ruby -c Formula/ttt.rb
      - name: Commit formula update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ttt.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update ttt to $VERSION"
            git push
          fi
