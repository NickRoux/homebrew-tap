name: Update formula

on:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable ttt version, without v (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          mkdir -p Formula
          gh release download "v$VERSION" --repo NickRoux/ttt --pattern ttt.rb --dir Formula --clobber
          ruby -c Formula/ttt.rb
      - name: Commit formula update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ttt.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update ttt to $VERSION"
            git push
          fi

  install-test:
    needs: update
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9
        with:
          stable: true
      - name: Install and test the published package
        env:
          VERSION: ${{ inputs.version }}
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew tap nickroux/tap
          git -C "$(brew --repository nickroux/tap)" fetch origin main
          git -C "$(brew --repository nickroux/tap)" checkout --detach origin/main
          brew install nickroux/tap/ttt
          brew test nickroux/tap/ttt
          test "$(ttt --version)" = "ttt $VERSION"
