name: Update formula

on:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable ttt version, without v (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          mkdir -p Formula
          gh release download "v$VERSION" --repo NickRoux/ttt --pattern ttt.rb --dir Formula --clobber
          ruby -c Formula/ttt.rb
      - name: Commit formula update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ttt.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update ttt to $VERSION"
            git push
          fi

  install-test:
    needs: update
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9
        with:
          stable: true
      - name: Install and test the published package
        env:
          VERSION: ${{ inputs.version }}
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew tap nickroux/tap
          git -C "$(brew --repository nickroux/tap)" fetch origin main
          git -C "$(brew --repository nickroux/tap)" checkout --detach origin/main
          brew install --build-bottle nickroux/tap/ttt
          brew test nickroux/tap/ttt
          test "$(ttt --version)" = "ttt $VERSION"
      - name: Build Homebrew bottle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p bottles
          cd bottles
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/NickRoux/homebrew-tap/releases/download/ttt-$VERSION" \
            nickroux/tap/ttt
          python3 - <<'PY'
          import json
          from pathlib import Path
          for metadata in Path(".").glob("*.json"):
              for package in json.loads(metadata.read_text()).values():
                  for bottle in package["bottle"]["tags"].values():
                      Path(bottle["local_filename"]).rename(bottle["filename"])
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bottle-${{ matrix.os }}
          path: bottles/*
          if-no-files-found: error

  publish-bottles:
    needs: install-test
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9
        with:
          stable: true
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bottles
          merge-multiple: true
      - name: Publish bottles and update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew tap nickroux/tap
          git -C "$(brew --repository nickroux/tap)" fetch origin main
          git -C "$(brew --repository nickroux/tap)" checkout --detach origin/main
          cd bottles
          brew bottle --merge --write --no-commit *.json
          gh release create "ttt-$VERSION" *.bottle.tar.gz --repo NickRoux/homebrew-tap \
            --title "ttt $VERSION Homebrew bottles" --notes "Native Homebrew binary packages for ttt $VERSION."
          cd "$(brew --repository nickroux/tap)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ttt.rb
          git commit -m "Add Homebrew bottles for ttt $VERSION"
          gh auth setup-git
          git push origin HEAD:main
